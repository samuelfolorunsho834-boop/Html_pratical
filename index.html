<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fOrms</title>
</head>
<body>
    <form>
        <label for="browsers">Browsers</label><br>
        <input type="text" name="browser" list="browser">
        <datalist id="browser">
            <option value="firefox">
            <option value="chrome">
            <option value="safari">
            <option value="edge">
        </datalist><br><br>
        <label for="password">password</label>
        <input type="password" name="password"id="browsers"><br>

        <input type="radio" name="type" value="truck">
        <label>truck</label><br>
        <input type="radio" name="type" value="truck">
        <label>wagon</label><br><br>

        <input type="checkbox" name="arabic" value="arabic">
        <label>i speak arabic</label><br><br> 

        <label for="color">choose color</label>
        <input type="color" name="color" id="color"><br><br>

        <label for="date">choose date</label>
        <input type="date" name="date"id="date"><br><br> 

        <label for="file">choose file</label>
        <input type="file" name="file"id="file"><br><br>
        
        <label for="month">choose month</label>
        <input type="month" name="month" id="month"><br><br>
        
        <label for="number">choose amount</label>
        <input type="number" name="number"id="number"><br><br>
        
        
        <label for="range">choose intensity</label><br><br>
        <input type="range" name="range"id="range" min="1" max="15"><br><br>
        
        <label for="time">choose time</label>
        <input type="time" name="time" id="time"><br><br>

        <input type="submit" name="submit" value="login">
        <input type="reset"> 
    </form>
</body>
